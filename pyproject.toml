[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentsync"
version = "0.5.1"
description = "Universal cross-platform synchronization, patching, context-handoff, and TUI suite for AI coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "agentsync contributors" },
]
keywords = [
    "ai-agents",
    "codex",
    "antigravity",
    "claude-code",
    "opencode",
    "deepseek",
    "mcp",
    "sync",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "tomli-w>=1.0",
    "watchdog>=4.0",
    "psutil>=6.0",
    "PyYAML>=6.0",
    "zstandard>=0.23",
    "textual>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "build>=1.2",
]

[project.scripts]
agentsync = "agentsync.cli:app"

[project.gui-scripts]
agentsyncw = "agentsync.daemon:main"

[project.urls]
Homepage = "https://github.com/saleqss/agentsync"
Repository = "https://github.com/saleqss/agentsync"
Issues = "https://github.com/saleqss/agentsync/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsync"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
