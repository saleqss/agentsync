name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run pytest test suite
        run: pytest -v

      - name: Build wheel and sdist
        run: python -m build

      - name: Smoke-test fresh wheel install
        shell: bash
        run: |
          python -m venv .smoke_venv
          if [ -f ".smoke_venv/Scripts/python.exe" ]; then
            PY=".smoke_venv/Scripts/python.exe"
            BIN=".smoke_venv/Scripts/agentsync.exe"
          else
            PY=".smoke_venv/bin/python"
            BIN=".smoke_venv/bin/agentsync"
          fi
          "$PY" -m pip install dist/*.whl
          "$BIN" --version
          "$BIN" --help
          "$BIN" tools list
