name: Bug Report
description: Report a bug, crash, SQLite error, or rendering glitch in AgentSync
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! For fastest triage, attach an anonymized diagnostics archive generated via:
        `agentsync support-bundle` (strictly strips API keys, tokens, emails, usernames, and all chat contents).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact command or TUI steps to reproduce.
      placeholder: |
        1. Run `agentsync doctor`
        2. Run `agentsync patch --dry-run`
        3. Observe error...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentSync version
      description: Output of `agentsync --version`
      placeholder: "agentsync 0.4.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System & Shell
      options:
        - Windows 11 (Windows Terminal)
        - Windows 11 (Legacy PowerShell / cmd.exe conhost)
        - Windows WSL2
        - macOS (zsh / bash)
        - Linux (bash / zsh / fish)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or doctor output
      description: Paste redacted output (never include API keys or tokens).
      render: text
